# ===================================================================
# CYPHERVAULT PRODUCTION SERVER CONFIGURATION
# ===================================================================

server.port=${PORT:8080}
server.shutdown=graceful
server.servlet.context-path=

spring.application.name=filehider-backend

# ===================================================================
# DATASOURCE & HIKARICP POOL CONFIGURATION
# ===================================================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/FileHider?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:zyc!}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Production Tuning
spring.datasource.hikari.pool-name=CypherVaultHikariPool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.leak-detection-threshold=60000

# ===================================================================
# JPA & HIBERNATE CONFIGURATION
# ===================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ===================================================================
# JAVAMAIL SENDER CONFIGURATION (Gmail SMTP SSL Port 465)
# ===================================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=465
spring.mail.username=${MAIL_USERNAME:satwiksaxena41@gmail.com}
spring.mail.password=${MAIL_PASSWORD:ggghghhhg}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2 TLSv1.3
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# ===================================================================
# MULTIPART / FILE UPLOAD LIMITS
# ===================================================================
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# ===================================================================
# CYPHERVAULT CRYPTOGRAPHY & JWT SECURITY
# ===================================================================
vault.security.master-key=${VAULT_MASTER_KEY:CypherVaultMasterSecretKey2026SecureProdModeAES256}
vault.jwt.secret=${JWT_SECRET:CypherVaultProductionJwtSecretKeyMustBeAtLeast256BitsLongForHMACSHA256Security}
vault.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ===================================================================
# PRODUCTION ACTUATOR & OBSERVABILITY
# ===================================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized
management.info.env.enabled=true

# ===================================================================
# OPENAPI / SWAGGER CONFIGURATION
# ===================================================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha

# ===================================================================
# LOGGING CONFIGURATION
# ===================================================================
logging.level.com.filehider=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
